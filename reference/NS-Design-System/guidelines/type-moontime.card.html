<!-- @dsCard group="Type" viewport="700x240" name="MOONTIME script" subtitle="The flowy, feminine face: event titles, one accent word, never body copy" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--bg-page);font-family:var(--font-body)}.lbl{font:var(--weight-bold) 10px/1 var(--font-body);letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--text-faint)}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}.panel{border-radius:var(--radius-card);padding:18px 20px;display:flex;flex-direction:column;justify-content:center}</style>
</head><body>
<div class="row">
<div class="panel" style="background:var(--ink-900)">
<span style="font-family:var(--font-display);font-weight:900;font-size:32px;letter-spacing:-.02em;text-transform:uppercase;color:#FF8FA8;text-shadow:var(--glow-pink)">Mom&rsquo;s</span>
<span style="font-family:var(--font-script);font-size:72px;line-height:.85;color:#FFF6B0;text-shadow:var(--glow-yellow);margin-top:2px">Club</span>
</div>
<div class="panel" style="background:var(--paper-100)">
<span style="font-family:var(--font-script);font-size:52px;line-height:1;color:var(--pink-700)">Stronger, together</span>
<span style="font-family:var(--font-script);font-size:34px;line-height:1.1;color:var(--text-muted);margin-top:6px">the quiet work</span>
</div>
</div>
<div class="lbl" style="margin-top:12px">--font-script: MOONTIME (assets/fonts/) &middot; --font-script-brush: Kaushan Script</div>
<div class="lbl" style="margin-top:6px;color:var(--text-muted)">MOONTIME is licensed to the brand and ships from assets/fonts/ (woff, otf, ttf). One word or one short phrase at a time. Never body copy, buttons, labels or long headlines.</div>
</body></html>
