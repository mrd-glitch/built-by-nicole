<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Page, card, sunken, accent, scrim" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-body)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{border-radius:var(--radius-md);overflow:hidden;width:86px;border:1px solid var(--border-hairline);background:var(--surface-card)}.chip i{display:block;height:52px}.chip b{display:block;font:var(--weight-bold) 10px/1.2 var(--font-body);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-strong);padding:7px 8px 1px}.chip s{display:block;text-decoration:none;font:var(--weight-medium) 10px/1.2 var(--font-mono);color:var(--text-faint);padding:0 8px 7px}.lbl{font:var(--weight-bold) 10px/1 var(--font-body);letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--text-faint)}</style>
</head><body>
<div class="sw">
<div class="chip"><i style="background:var(--bg-page)"></i><b>Page</b><s>--bg-page</s></div>
<div class="chip"><i style="background:var(--surface-card);box-shadow:var(--shadow-2)"></i><b>Card</b><s>--surface-card</s></div>
<div class="chip"><i style="background:var(--surface-sunken)"></i><b>Sunken</b><s>--surface-sunken</s></div>
<div class="chip"><i style="background:var(--bg-page-invert)"></i><b>Page invert</b><s>--bg-page-invert</s></div>
<div class="chip"><i style="background:var(--surface-card-invert)"></i><b>Card invert</b><s>--surface-card-invert</s></div>
<div class="chip"><i style="background:var(--surface-accent)"></i><b>Accent</b><s>--surface-accent</s></div>
<div class="chip"><i style="background:var(--surface-highlight)"></i><b>Highlight</b><s>--surface-highlight</s></div>
</div>
</body></html>
