<!-- @dsCard group="Spacing" viewport="700x160" name="Borders & rules" subtitle="Hairline on cards, 2px ink on outlines, 3px pink accent rule" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-md);overflow:hidden;width:104px;border:1px solid var(--border-hairline);background:var(--surface-card)}.chip i{display:block;height:52px}.chip b{display:block;font:var(--weight-bold) 10px/1.2 var(--font-body);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-strong);padding:7px 8px 1px}.chip s{display:block;text-decoration:none;font:var(--weight-medium) 10px/1.2 var(--font-mono);color:var(--text-faint);padding:0 8px 7px}.lbl{font:var(--weight-bold) 10px/1 var(--font-body);letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--text-faint)}</style>
</head><body>
<div style="display:flex;flex-direction:column;gap:12px;max-width:520px">
<div style="border:1px solid var(--border-hairline);border-radius:var(--radius-card);padding:10px 14px;font-size:13px;color:var(--text-muted);background:var(--surface-card)">1px hairline — --border-hairline</div>
<div style="border:2px solid var(--border-strong);border-radius:var(--radius-pill);padding:8px 18px;font:700 12px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--text-strong);align-self:flex-start">2px ink — outline control</div>
<div style="border-bottom:var(--rule-accent);padding-bottom:8px;font:700 13px/1 var(--font-body);letter-spacing:.06em;text-transform:uppercase;color:var(--text-strong)">3px pink — active tab rule</div>
</div>
</body></html>
