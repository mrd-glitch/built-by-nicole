<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-body)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{border-radius:var(--radius-md);overflow:hidden;width:86px;border:1px solid var(--border-hairline);background:var(--surface-card)}.chip i{display:block;height:52px}.chip b{display:block;font:var(--weight-bold) 10px/1.2 var(--font-body);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-strong);padding:7px 8px 1px}.chip s{display:block;text-decoration:none;font:var(--weight-medium) 10px/1.2 var(--font-mono);color:var(--text-faint);padding:0 8px 7px}.lbl{font:var(--weight-bold) 10px/1 var(--font-body);letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--text-faint)}</style>
</head><body>
<div class="sw"><div class="chip"><i style="background:var(--ink)"></i><b>Ink</b><s>#0D0D0F</s></div><div class="chip"><i style="background:var(--paper)"></i><b>Paper</b><s>#FAFAF8</s></div><div class="chip"><i style="background:var(--pink)"></i><b>Hot pink</b><s>#FF1F6B</s></div><div class="chip"><i style="background:var(--pink-deep)"></i><b>Deep pink</b><s>#C9004E</s></div><div class="chip"><i style="background:var(--yellow)"></i><b>Yellow</b><s>#FFE500</s></div><div class="chip"><i style="background:var(--yellow-deep)"></i><b>Deep yellow</b><s>#E8C400</s></div><div class="chip"><i style="background:var(--grey)"></i><b>Grey</b><s>#6E6E76</s></div></div>
</body></html>
