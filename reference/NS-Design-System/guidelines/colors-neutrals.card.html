<!-- @dsCard group="Colors" viewport="700x290" name="Neutral ramp" subtitle="Ink through paper — carries almost every surface" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-body)}.sw{display:flex;gap:8px;flex-wrap:wrap}.chip{border-radius:var(--radius-md);overflow:hidden;width:86px;border:1px solid var(--border-hairline);background:var(--surface-card)}.chip i{display:block;height:52px}.chip b{display:block;font:var(--weight-bold) 10px/1.2 var(--font-body);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-strong);padding:7px 8px 1px}.chip s{display:block;text-decoration:none;font:var(--weight-medium) 10px/1.2 var(--font-mono);color:var(--text-faint);padding:0 8px 7px}.lbl{font:var(--weight-bold) 10px/1 var(--font-body);letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--text-faint)}</style>
</head><body>
<div class="sw"><div class="chip"><i style="background:var(--ink-900)"></i><b>ink-900</b><s>#0D0D0F</s></div><div class="chip"><i style="background:var(--ink-800)"></i><b>ink-800</b><s>#16161A</s></div><div class="chip"><i style="background:var(--ink-700)"></i><b>ink-700</b><s>#1F1F24</s></div><div class="chip"><i style="background:var(--ink-600)"></i><b>ink-600</b><s>#2B2B31</s></div><div class="chip"><i style="background:var(--grey-600)"></i><b>grey-600</b><s>#4A4A52</s></div><div class="chip"><i style="background:var(--grey-500)"></i><b>grey-500</b><s>#6E6E76</s></div><div class="chip"><i style="background:var(--grey-400)"></i><b>grey-400</b><s>#9A9AA2</s></div><div class="chip"><i style="background:var(--grey-300)"></i><b>grey-300</b><s>#C4C4CA</s></div><div class="chip"><i style="background:var(--grey-200)"></i><b>grey-200</b><s>#E2E2E0</s></div><div class="chip"><i style="background:var(--paper-100)"></i><b>paper-100</b><s>#F2F2EE</s></div><div class="chip"><i style="background:var(--paper-50)"></i><b>paper-50</b><s>#FAFAF8</s></div><div class="chip"><i style="background:var(--white)"></i><b>white</b><s>#FFFFFF</s></div></div>
</body></html>
