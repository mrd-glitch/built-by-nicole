<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-md);overflow:hidden;width:104px;border:1px solid var(--border-hairline);background:var(--surface-card)}.chip i{display:block;height:52px}.chip b{display:block;font:var(--weight-bold) 10px/1.2 var(--font-body);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-strong);padding:7px 8px 1px}.chip s{display:block;text-decoration:none;font:var(--weight-medium) 10px/1.2 var(--font-mono);color:var(--text-faint);padding:0 8px 7px}.lbl{font:var(--weight-bold) 10px/1 var(--font-body);letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--text-faint)}</style>
</head><body>
<div style="display:flex;align-items:flex-end;gap:8px"><div style="text-align:center"><div style="width:4px;height:4px;background:var(--accent);border-radius:2px"></div><div class="lbl" style="margin-top:6px">4</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--accent);border-radius:2px"></div><div class="lbl" style="margin-top:6px">8</div></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--accent);border-radius:2px"></div><div class="lbl" style="margin-top:6px">12</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--accent);border-radius:2px"></div><div class="lbl" style="margin-top:6px">16</div></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--accent);border-radius:2px"></div><div class="lbl" style="margin-top:6px">20</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--accent);border-radius:2px"></div><div class="lbl" style="margin-top:6px">24</div></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--accent);border-radius:2px"></div><div class="lbl" style="margin-top:6px">32</div></div><div style="text-align:center"><div style="width:40px;height:40px;background:var(--accent);border-radius:2px"></div><div class="lbl" style="margin-top:6px">40</div></div><div style="text-align:center"><div style="width:48px;height:48px;background:var(--accent);border-radius:2px"></div><div class="lbl" style="margin-top:6px">48</div></div><div style="text-align:center"><div style="width:64px;height:64px;background:var(--accent);border-radius:2px"></div><div class="lbl" style="margin-top:6px">64</div></div><div style="text-align:center"><div style="width:80px;height:80px;background:var(--accent);border-radius:2px"></div><div class="lbl" style="margin-top:6px">80</div></div><div style="text-align:center"><div style="width:96px;height:96px;background:var(--accent);border-radius:2px"></div><div class="lbl" style="margin-top:6px">96</div></div></div>
<div class="lbl" style="margin-top:12px">--space-1 … --space-32</div>
</body></html>
