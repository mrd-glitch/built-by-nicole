<!-- @dsCard group="Spacing" viewport="700x190" name="Motion" subtitle="Short, flat easing; one snap reserved for toggles" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-md);overflow:hidden;width:104px;border:1px solid var(--border-hairline);background:var(--surface-card)}.chip i{display:block;height:52px}.chip b{display:block;font:var(--weight-bold) 10px/1.2 var(--font-body);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-strong);padding:7px 8px 1px}.chip s{display:block;text-decoration:none;font:var(--weight-medium) 10px/1.2 var(--font-mono);color:var(--text-faint);padding:0 8px 7px}.lbl{font:var(--weight-bold) 10px/1 var(--font-body);letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--text-faint)}.rows{display:flex;flex-direction:column;gap:2px}.r{display:grid;grid-template-columns:150px 130px 1fr;gap:12px;font-size:12px;color:var(--text-body);border-bottom:1px solid var(--border-hairline);padding:4px 0}.r s{text-decoration:none;font:11px/1.4 var(--font-mono);color:var(--text-strong)}.r em{font-style:normal;color:var(--text-muted)}</style>
</head><body>
<div class="rows"><div class="r"><s>--dur-instant</s><span>80ms</span><em>press feedback</em></div><div class="r"><s>--dur-fast</s><span>140ms</span><em>hover, tooltip</em></div><div class="r"><s>--dur-base</s><span>220ms</span><em>toggles, fades</em></div><div class="r"><s>--dur-slow</s><span>380ms</span><em>dialog rise</em></div><div class="r"><s>--dur-reveal</s><span>600ms</span><em>scroll reveal</em></div><div class="r"><s>--ease-standard</s><span>0.2,0,0.2,1</span><em>default</em></div><div class="r"><s>--ease-out</s><span>0.16,1,0.3,1</span><em>entrances</em></div><div class="r"><s>--ease-snap</s><span>0.34,1.32,0.64,1</span><em>switch knob only</em></div></div>
</body></html>
