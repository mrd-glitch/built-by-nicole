<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-md);overflow:hidden;width:104px;border:1px solid var(--border-hairline);background:var(--surface-card)}.chip i{display:block;height:52px}.chip b{display:block;font:var(--weight-bold) 10px/1.2 var(--font-body);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-strong);padding:7px 8px 1px}.chip s{display:block;text-decoration:none;font:var(--weight-medium) 10px/1.2 var(--font-mono);color:var(--text-faint);padding:0 8px 7px}.lbl{font:var(--weight-bold) 10px/1 var(--font-body);letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--text-faint)}</style>

<div class="sw"><div style="text-align:center"><div style="width:76px;height:58px;background:var(--ink-900);border-radius:2px"></div><div class="lbl" style="margin-top:6px">xs · 2px</div></div><div style="text-align:center"><div style="width:76px;height:58px;background:var(--ink-900);border-radius:4px"></div><div class="lbl" style="margin-top:6px">sm · 4px</div></div><div style="text-align:center"><div style="width:76px;height:58px;background:var(--ink-900);border-radius:8px"></div><div class="lbl" style="margin-top:6px">md · 8px</div></div><div style="text-align:center"><div style="width:76px;height:58px;background:var(--ink-900);border-radius:14px"></div><div class="lbl" style="margin-top:6px">lg · 14px</div></div><div style="text-align:center"><div style="width:76px;height:58px;background:var(--ink-900);border-radius:20px"></div><div class="lbl" style="margin-top:6px">xl · 20px</div></div><div style="text-align:center"><div style="width:76px;height:58px;background:var(--ink-900);border-radius:999px"></div><div class="lbl" style="margin-top:6px">pill · 999px</div></div></div>
<div class="lbl" style="margin-top:10px">card 14 · input 4 · sheet 20 · control pill</div>
