<!-- @dsCard group="Colors" viewport="700x210" name="Text roles" subtitle="Semantic aliases — use these, not raw ramp values" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);font-family:var(--font-body)}.sw{display:flex;gap:10px;flex-wrap:wrap}.chip{border-radius:var(--radius-md);overflow:hidden;width:104px;border:1px solid var(--border-hairline);background:var(--surface-card)}.chip i{display:block;height:52px}.chip b{display:block;font:var(--weight-bold) 10px/1.2 var(--font-body);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--text-strong);padding:7px 8px 1px}.chip s{display:block;text-decoration:none;font:var(--weight-medium) 10px/1.2 var(--font-mono);color:var(--text-faint);padding:0 8px 7px}.lbl{font:var(--weight-bold) 10px/1 var(--font-body);letter-spacing:var(--tracking-widest);text-transform:uppercase;color:var(--text-faint)}.rows{display:flex;flex-direction:column;gap:2px}.r{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:var(--weight-medium);padding:5px 10px;border-radius:var(--radius-sm)}.r s{text-decoration:none;font:10px/1 var(--font-mono);color:var(--text-faint)}.dark{background:var(--ink-900)}</style>
</head><body>
<div class="rows">
<div class="r"><span style="color:var(--text-strong)">Strong — headlines and numbers</span><s>--text-strong</s></div>
<div class="r"><span style="color:var(--text-body)">Body — the default reading colour</span><s>--text-body</s></div>
<div class="r"><span style="color:var(--text-muted)">Muted — labels, meta, hints</span><s>--text-muted</s></div>
<div class="r"><span style="color:var(--text-faint)">Faint — placeholders, disabled</span><s>--text-faint</s></div>
<div class="r"><span style="color:var(--text-accent)">Accent — links and emphasis on paper</span><s>--text-accent</s></div>
<div class="r dark"><span style="color:var(--text-invert)">Invert — on ink</span><s style="color:var(--grey-400)">--text-invert</s></div>
<div class="r dark"><span style="color:var(--text-accent-invert)">Accent invert — pink on ink</span><s style="color:var(--grey-400)">--text-accent-invert</s></div>
</div>
</body></html>
