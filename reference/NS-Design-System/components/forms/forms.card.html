<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>NS form components</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--bg-page)}.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}.stack{display:flex;flex-direction:column;gap:14px}.dark{background:var(--ink-900);border-radius:var(--radius-card);padding:16px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.NSDesignSystem_14b176;
function Demo(){
  return <div className="cols">
    <div className="stack">
      <Input label="Email" type="email" placeholder="you@email.com" required />
      <Input label="Body weight" defaultValue="lots" adornment="lb" error="Numbers only" />
      <Input label="Where are you at?" as="textarea" rows={3} placeholder="Tell me the real answer." />
    </div>
    <div className="stack">
      <Select label="Goal" options={["Build muscle","Cut","First show","Get strong"]} />
      <Input label="Locked" defaultValue="March cohort" disabled />
      <div className="stack" style={{gap:2}}>
        <Checkbox label="Text me session reminders" hint="Two per week, no spam" defaultChecked />
        <Checkbox label="Add me to the leaderboard" />
        <Radio name="tier" label="Group coaching" defaultChecked />
        <Radio name="tier" label="1:1 coaching" />
      </div>
    </div>
    <div className="stack">
      <Switch label="Rest-day reminders" defaultChecked />
      <Switch label="Weekly check-in email" />
      <div className="dark stack">
        <Input label="Name" invert placeholder="First name" />
        <Switch label="Push notifications" invert defaultChecked labelPosition="start" />
        <Checkbox label="I'm in" invert defaultChecked />
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
